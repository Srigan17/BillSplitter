<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Bill Splitter</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">⚖️</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to manage your group bills & settlements</p>
      </div>

      <div id="authAlert" class="alert-box"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="margin-top: 0.5rem; width: 100%;">
          Log In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Sign up</a>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to index
      if (Auth.isAuthenticated()) {
        window.location.href = 'index.html';
      }

      const form = document.getElementById('loginForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginSubmitBtn');
        const alertBox = document.getElementById('authAlert');

        try {
          btn.disabled = true;
          btn.textContent = 'Logging in...';
          alertBox.className = 'alert-box';
          alertBox.textContent = '';

          await Auth.login(email, password);
          window.location.href = 'index.html';
        } catch (err) {
          alertBox.textContent = err.message || 'Login failed';
          alertBox.className = 'alert-box error active';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Log In';
        }
      });
    });
  </script>
</body>
</html>
