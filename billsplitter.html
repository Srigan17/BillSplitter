                    }).join('')}
                </div>
            `;
            
            // Show optimized settlements
            settlementHTML += `
                <div>
                    <h4 style="margin-bottom: 1rem; color: var(--text-primary); font-weight: 600;">🔄 Optimized Settlements:</h4>
                    <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1rem;">
                        Minimum ${settlements.length} transaction${settlements.length !== 1 ? 's' : ''} needed to settle all balances:
                    </p>
                    ${settlements.map((settlement, index) => `
                        <div class="settlement-item slide-in" style="animation-delay: ${index * 0.1}s;">
                            <div class="settlement-text">
                                <strong>${settlement.fromName}</strong> pays <strong>${settlement.toName}</strong>
                            </div>
                            <div class="settlement-arrow">→</div>
                            <div class="settlement-amount">$${settlement.amount.toFixed(2)}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            settlementList.innerHTML = settlementHTML;
        }

        // Dashboard
        function renderDashboard() {
            const currentGroup = getCurrentGroup();
            const groupExpenses = appState.expenses.filter(e => e.groupId === appState.currentGroupId);
            
            // Update stats
            const totalExpenses = groupExpenses.reduce((sum, expense) => sum + expense.amount, 0);
            const totalMembers = currentGroup ? currentGroup.members.length : 0;
            
            document.getElementById('totalExpenses').textContent = `$${totalExpenses.toFixed(2)}`;
            document.getElementById('totalMembers').textContent = totalMembers;
            
            // Update chart
            updateExpenseChart();
        }

        function updateExpenseChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const currentGroup = getCurrentGroup();
            const groupExpenses = appState.expenses.filter(e => e.groupId === appState.currentGroupId);
            
            if (expenseChart) {
                expenseChart.destroy();
            }
            
            if (!currentGroup || groupExpenses.length === 0) {
                expenseChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['No Data'],
                        datasets: [{
                            data: [1],
                            backgroundColor: ['#e5e7eb'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        }
                    }
                });
                return;
            }
            
            // Calculate spending by member
            const spendingByMember = {};
            currentGroup.members.forEach(member => {
                spendingByMember[member.id] = 0;
            });
            
            groupExpenses.forEach(expense => {
                if (expense.payments) {
                    // New format with multiple payers support
                    expense.payments.forEach(payment => {
                        spendingByMember[payment.memberId] += payment.amount;
                    });
                } else if (expense.payerId) {
                    // Legacy format with single payer
                    spendingByMember[expense.payerId] += expense.amount;
                }
            });
            
            const labels = [];
            const data = [];
            const colors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#84cc16', '#f97316'];
            
            Object.entries(spendingByMember).forEach(([memberId, amount], index) => {
                if (amount > 0) {
                    const member = currentGroup.members.find(m => m.id === memberId);
                    labels.push(member?.name || 'Unknown');
                    data.push(amount);
                }
            });
            
            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: colors.slice(0, data.length),
                        borderWidth: 2,
                        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--card-color')
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true,
                                color: getComputedStyle(document.documentElement).getPropertyValue('--text-primary')
                            }
                        }
                    }
                }
            });
        }

        // Modal Management
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Theme Management
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
            
            localStorage.setItem('billSplitterTheme', newTheme);
            
            // Update chart colors
            setTimeout(updateExpenseChart, 100);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('billSplitterTheme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        // Export/Import Functions
        function exportData() {
            const exportData = {
                groups: appState.groups,
                expenses: appState.expenses,
                exportDate: new Date().toISOString(),
                version: '1.0'
            };
            
            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `bill-splitter-export-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            
            showToast('Data exported successfully!');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if (!importedData.groups || !importedData.expenses) {
                        throw new Error('Invalid file format');
                    }
                    
                    if (confirm('This will replace all current data. Continue?')) {
                        appState.groups = importedData.groups;
                        appState.expenses = importedData.expenses;
                        appState.currentGroupId = appState.groups.length > 0 ? appState.groups[0].id : null;
                        
                        saveData();
                        
                        renderGroups();
                        renderMembers();
                        renderExpenses();
                        renderSettlements();
                        renderDashboard();
                        
                        showToast('Data imported successfully!');
                    }
                } catch (error) {
                    showToast('Error importing file. Please check the format.', 'error');
                }
            };
            reader.readAsText(file);
            
            // Reset file input
            event.target.value = '';
        }

        // PDF Report Generation
        function generatePDF() {
            const currentGroup = getCurrentGroup();
            if (!currentGroup) {
                showToast('No group selected', 'error');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Title
            doc.setFontSize(20);
            doc.text(`${currentGroup.name} - Expense Report`, 20, 30);
            
            // Date
            doc.setFontSize(12);
            doc.text(`Generated on: ${new Date().toLocaleDateString()}`, 20, 45);
            
            let yPosition = 65;
            
            // Members section
            doc.setFontSize(16);
            doc.text('Members:', 20, yPosition);
            yPosition += 10;
            
            const balances = calculateBalances();
            doc.setFontSize(12);
            currentGroup.members.forEach(member => {
                const balance = balances[member.id] || 0;
                const balanceText = balance > 0 ? `Gets $${Math.abs(balance).toFixed(2)}` : 
                                 balance < 0 ? `Owes $${Math.abs(balance).toFixed(2)}` : 'Settled';
                doc.text(`• ${member.name}: ${balanceText}`, 25, yPosition);
                yPosition += 8;
            });
            
            yPosition += 10;
            
            // Expenses section
            const groupExpenses = appState.expenses.filter(e => e.groupId === appState.currentGroupId);
            if (groupExpenses.length > 0) {
                doc.setFontSize(16);
                doc.text('Expenses:', 20, yPosition);
                yPosition += 10;
                
                doc.setFontSize(12);
                groupExpenses.forEach(expense => {
                    let payerInfo = '';
                    if (expense.payments) {
                        const payers = expense.payments.map(payment => {
                            const member = currentGroup.members.find(m => m.id === payment.memberId);
                            return `${member?.name || 'Unknown'}: $${payment.amount.toFixed(2)}`;
                        });
                        payerInfo = payers.join(', ');
                    } else if (expense.payerId) {
                        const payer = currentGroup.members.find(m => m.id === expense.payerId);
                        payerInfo = payer?.name || 'Unknown';
                    }
                    
                    doc.text(`• ${expense.title}: $${expense.amount.toFixed(2)} (${payerInfo}) - ${new Date(expense.date).toLocaleDateString()}`, 25, yPosition);
                    yPosition += 8;
                    
                    if (yPosition > 270) {
                        doc.addPage();
                        yPosition = 30;
                    }
                });
                
                yPosition += 10;
            }
            
            // Settlements section
            const settlements = optimizeSettlements(balances);
            if (settlements.length > 0) {
                doc.setFontSize(16);
                doc.text('Settlements:', 20, yPosition);
                yPosition += 10;
                
                doc.setFontSize(12);
                settlements.forEach(settlement => {
                    const fromMember = currentGroup.members.find(m => m.id === settlement.from);
                    const toMember = currentGroup.members.find(m => m.id === settlement.to);
                    doc.text(`• ${fromMember?.name || 'Unknown'} owes ${toMember?.name || 'Unknown'}: $${settlement.amount.toFixed(2)}`, 25, yPosition);
                    yPosition += 8;
                });
            }
            
            // Total
            const totalExpenses = groupExpenses.reduce((sum, expense) => sum + expense.amount, 0);
            yPosition += 10;
            doc.setFontSize(14);
            doc.text(`Total Expenses: $${totalExpenses.toFixed(2)}`, 20, yPosition);
            
            // Save PDF
            doc.save(`${currentGroup.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_expense_report.pdf`);
            showToast('PDF report generated successfully!');
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', init);
    </script>
